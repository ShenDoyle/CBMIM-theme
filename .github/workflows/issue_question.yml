name: Issue Question

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  create-comment:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'question'
    steps:
      - name: Create comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "你好 @${{ github.event.issue.user.login }}，请按照 issue 模板填写并详细说明问题和复现步骤。60 天内未回复的 issue 将被自动关闭。"
